---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: correlation-engine
  namespace: autosre
  labels:
    app: correlation-engine
    app.kubernetes.io/name: correlation-engine
    app.kubernetes.io/part-of: autosre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: correlation-engine
  template:
    metadata:
      labels:
        app: correlation-engine
        app.kubernetes.io/part-of: autosre
    spec:
      containers:
        # Keep this name equal to the service name - the PodRestartsHigh rule
        # turns the `container` label into the `service` label.
        - name: correlation-engine
          image: autosre/correlation-engine:dev
          # Images are built straight into minikube's Docker daemon, never pulled.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: correlation-engine
            # Second opinion from raw metrics. "shadow" only annotates and counts; switch
            # to "gate" to have the engine escalate when the metrics disagree. If the
            # scorer is absent or slow the engine carries on as if it had not asked.
            - name: SECOND_OPINION_URL
              value: http://second-opinion.autosre.svc.cluster.local:8000
            - name: SECOND_OPINION_MODE
              value: shadow
          resources:
            # Deliberately low so symptoms can be triggered on demand (brief section 4).
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Without probes, pod-restart symptoms never fire naturally.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: correlation-engine
  namespace: autosre
  labels:
    app: correlation-engine
    app.kubernetes.io/part-of: autosre
spec:
  type: ClusterIP
  selector:
    app: correlation-engine
  ports:
    - name: http
      port: 8000
      targetPort: http
