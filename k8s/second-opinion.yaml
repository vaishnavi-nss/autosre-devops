---
# The metric scorer the correlation engine consults after the rules have decided.
# It is a separate service because scikit-learn does not fit in the engine's 128Mi limit,
# and because it only reads: it queries Prometheus and returns a verdict, never acting.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: second-opinion
  namespace: autosre
  labels:
    app: second-opinion
    app.kubernetes.io/name: second-opinion
    app.kubernetes.io/part-of: autosre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: second-opinion
  template:
    metadata:
      labels:
        app: second-opinion
        app.kubernetes.io/part-of: autosre
    spec:
      containers:
        # Keep this name equal to the service name - the PodRestartsHigh rule
        # turns the `container` label into the `service` label.
        - name: second-opinion
          image: autosre/second-opinion:ml-integration-e9f736f-20261112-a61f9c2b
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: second-opinion
            - name: PROMETHEUS_URL
              value: http://monitoring-kube-prometheus-prometheus.monitoring:9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: second-opinion
  namespace: autosre
  labels:
    app: second-opinion
    app.kubernetes.io/part-of: autosre
spec:
  type: ClusterIP
  selector:
    app: second-opinion
  ports:
    - name: http
      port: 8000
      targetPort: http
