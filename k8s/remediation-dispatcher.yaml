---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-dispatcher
  namespace: autosre
---
# Least privilege for the five approved playbooks, in the autosre namespace only:
#   restart_service.yml / scale_replicas.yml : read and patch deployments, scale them
#   clear_logs.yml                          : find the database pod and run a command in it (pods/exec)
#   verification                            : read deployments and pods
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remediation-dispatcher
  namespace: autosre
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]                # rollback_deployment.yml reads the previous revision's pod template
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    # The python client opens exec as a WebSocket (GET), so `get` is needed as well as `create` (found on the real cluster: 403 on pods/exec).
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediation-dispatcher
  namespace: autosre
subjects:
  - kind: ServiceAccount
    name: remediation-dispatcher
    namespace: autosre
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: remediation-dispatcher
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-dispatcher
  namespace: autosre
  labels:
    app: remediation-dispatcher
    app.kubernetes.io/part-of: autosre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediation-dispatcher
  template:
    metadata:
      labels:
        app: remediation-dispatcher
        app.kubernetes.io/part-of: autosre
    spec:
      serviceAccountName: remediation-dispatcher
      securityContext:
        fsGroup: 10001                  # the image runs as uid 10001; the history volume must be writable by it
      containers:
        # Keep this name equal to the service name - the PodRestartsHigh rule turns the `container` label into `service`.
        - name: remediation-dispatcher
          image: autosre/remediation-dispatcher:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            # Live execution is OFF by default. Turn it on only for a named, approved run and turn it off afterwards.
            - name: AUTO_REMEDIATE
              value: "false"
            - name: MIN_CONFIDENCE
              value: "0.75"
            # agree: the second opinion must agree. not_disagree: only a disagreement blocks. ignore: not consulted.
            - name: SECOND_OPINION_POLICY
              value: "agree"
            - name: COOLDOWN_SECONDS
              value: "600"
            - name: TARGET_NAMESPACE
              value: "autosre"
            # Finished executions are appended here and reloaded after a restart, so the dashboard keeps its history.
            - name: EXEC_LOG
              value: /data/executions.jsonl
          volumeMounts:
            - name: history
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: history
          persistentVolumeClaim:
            claimName: remediation-dispatcher-history
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: remediation-dispatcher-history
  namespace: autosre
  labels:
    app: remediation-dispatcher
    app.kubernetes.io/part-of: autosre
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: remediation-dispatcher
  namespace: autosre
  labels:
    app: remediation-dispatcher
    app.kubernetes.io/part-of: autosre
spec:
  type: ClusterIP
  selector:
    app: remediation-dispatcher
  ports:
    - name: http
      port: 8001
      targetPort: http
