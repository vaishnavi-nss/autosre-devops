---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: autosre
  labels:
    app: transaction-service
    app.kubernetes.io/name: transaction-service
    app.kubernetes.io/part-of: autosre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
        app.kubernetes.io/part-of: autosre
    spec:
      containers:
        # Keep this name equal to the service name - the PodRestartsHigh rule
        # turns the `container` label into the `service` label.
        - name: transaction-service
          image: autosre/transaction-service:dev
          # Images are built straight into minikube's Docker daemon, never pulled.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: transaction-service
            - name: DOWNSTREAM_URL
              value: "http://database.autosre.svc.cluster.local:8000"
            - name: DB_POOL_MAX
              value: "20"
          resources:
            # Deliberately low so symptoms can be triggered on demand (brief section 4).
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Without probes, pod-restart symptoms never fire naturally.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: autosre
  labels:
    app: transaction-service
    app.kubernetes.io/part-of: autosre
spec:
  type: ClusterIP
  selector:
    app: transaction-service
  ports:
    - name: http
      port: 8000
      targetPort: http
