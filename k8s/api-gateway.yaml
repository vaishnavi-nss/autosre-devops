---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: autosre
  labels:
    app: api-gateway
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: autosre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        app.kubernetes.io/part-of: autosre
    spec:
      containers:
        # Keep this name equal to the service name - the PodRestartsHigh rule
        # turns the `container` label into the `service` label.
        - name: api-gateway
          image: autosre/api-gateway:dev
          # Images are built straight into minikube's Docker daemon, never pulled.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: api-gateway
            - name: DOWNSTREAM_URL
              value: "http://transaction-service.autosre.svc.cluster.local:8000"
          resources:
            # Deliberately low so symptoms can be triggered on demand (brief section 4).
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Without probes, pod-restart symptoms never fire naturally.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: autosre
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: autosre
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
