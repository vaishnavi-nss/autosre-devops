---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: autosre
  labels:
    app: database
    app.kubernetes.io/name: database
    app.kubernetes.io/part-of: autosre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
        app.kubernetes.io/part-of: autosre
    spec:
      containers:
        # Keep this name equal to the service name - the PodRestartsHigh rule
        # turns the `container` label into the `service` label.
        - name: database
          image: autosre/database:dev
          # Images are built straight into minikube's Docker daemon, never pulled.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SERVICE_NAME
              value: database
            # The disk metric is the real size of *.log files in LOG_DIR (an emptyDir) against this capacity, on top of a
            # fixed baseline for the data itself. clear_logs.yml removes those files; nothing else is ever touched.
            - name: LOG_DIR
              value: /var/log/app
            - name: DB_DISK_CAPACITY_MB
              value: "40"
            - name: DB_BASE_RATIO
              value: "0.30"
          volumeMounts:
            - name: app-logs
              mountPath: /var/log/app
          resources:
            # Deliberately low so symptoms can be triggered on demand (brief section 4).
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Without probes, pod-restart symptoms never fire naturally.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      securityContext:
        fsGroup: 10001
      volumes:
        # Bounded well above DB_DISK_CAPACITY_MB so a disk fault can never fill the node or get the pod evicted.
        - name: app-logs
          emptyDir:
            sizeLimit: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: autosre
  labels:
    app: database
    app.kubernetes.io/part-of: autosre
spec:
  type: ClusterIP
  selector:
    app: database
  ports:
    - name: http
      port: 8000
      targetPort: http
