---
- name: Restart only the approved transaction service and wait for its new rollout
  hosts: localhost
  gather_facts: false
  vars:
    k8s_namespace: autosre
    target_service: transaction-service
  module_defaults:
    group/kubernetes.core.k8s:
      host: https://kubernetes.default.svc
      api_key: "{{ lookup('ansible.builtin.file', '/var/run/secrets/kubernetes.io/serviceaccount/token') }}"
      ca_cert: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      validate_certs: true
  tasks:
    - name: Enforce the reviewed scope and unique operation identity
      ansible.builtin.assert:
        that:
          - k8s_namespace == 'autosre'
          - target_service == 'transaction-service'
          - remediation_id is defined
          - remediation_id | length == 36
    - name: Trigger an identifiable rolling restart
      kubernetes.core.k8s:
        api_version: apps/v1
        kind: Deployment
        name: "{{ target_service }}"
        namespace: "{{ k8s_namespace }}"
        state: patched
        definition:
          spec:
            template:
              metadata:
                annotations:
                  autosre.io/remediation-id: "{{ remediation_id }}"
                  autosre.io/restarted-by: remediation-dispatcher
      register: restart_patch
    - name: Wait for this generation and removal of old replicas
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ target_service }}"
        namespace: "{{ k8s_namespace }}"
      register: deployment_state
      until:
        - deployment_state.resources | length == 1
        - deployment_state.resources[0].status.observedGeneration | default(0) >= restart_patch.result.metadata.generation
        - deployment_state.resources[0].status.updatedReplicas | default(0) == deployment_state.resources[0].spec.replicas
        - deployment_state.resources[0].status.replicas | default(0) == deployment_state.resources[0].spec.replicas
        - deployment_state.resources[0].status.readyReplicas | default(0) == deployment_state.resources[0].spec.replicas
        - deployment_state.resources[0].status.availableReplicas | default(0) == deployment_state.resources[0].spec.replicas
      retries: 45
      delay: 3
    - name: Record the completed generation
      ansible.builtin.debug:
        msg: "Operation {{ remediation_id }} completed generation {{ restart_patch.result.metadata.generation }}; application recovery is checked by dispatcher."
