---
# Remediation for: bad_rollout_transaction_service, bad_rollout_api_gateway
#
# Uses the Kubernetes collection's own module `kubernetes.core.k8s_rollback` (the equivalent of `kubectl rollout undo deployment/<target_service>`):
# the pod template of the PREVIOUS revision is put back, so an environment variable, image or probe that the bad revision changed is undone.
#
# Safe by construction: only the two approved services, only the autosre namespace. It only finishes once the NEW rollout (a higher generation)
# is complete and every replica is available, so a playbook that "succeeded" without really changing anything is caught here and by the dispatcher.
#
#   ansible-playbook -i ../inventory/localhost.yml rollback_deployment.yml -e target_service=transaction-service
- name: Roll a deployment back to its previous revision
  hosts: localhost
  gather_facts: false

  vars:
    k8s_namespace: autosre
    target_service: transaction-service
    allowed_services: [transaction-service, api-gateway]
    allowed_namespaces: [autosre]

  tasks:
    - name: Refuse anything outside the approved targets
      ansible.builtin.assert:
        that:
          - target_service in allowed_services
          - k8s_namespace in allowed_namespaces
        fail_msg: "{{ k8s_namespace }}/{{ target_service }} is not an approved rollback target."

    - name: Read the deployment before the rollback
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ target_service }}"
        namespace: "{{ k8s_namespace }}"
      register: before

    - name: Fail early if the deployment does not exist
      ansible.builtin.assert:
        that: before.resources | length == 1
        fail_msg: "{{ target_service }} not found in {{ k8s_namespace }}."

    - name: Roll {{ target_service }} back to its previous revision
      kubernetes.core.k8s_rollback:
        api_version: apps/v1
        kind: Deployment
        name: "{{ target_service }}"
        namespace: "{{ k8s_namespace }}"
      register: undone

    - name: Wait for the rollout to be complete and available
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ target_service }}"
        namespace: "{{ k8s_namespace }}"
      register: rolled
      until:
        - rolled.resources | length == 1
        - rolled.resources[0].metadata.generation | int > before.resources[0].metadata.generation | int
        - rolled.resources[0].status.observedGeneration | default(0) | int >= rolled.resources[0].metadata.generation | int
        - rolled.resources[0].status.updatedReplicas | default(0) | int == rolled.resources[0].spec.replicas | int
        - rolled.resources[0].status.availableReplicas | default(0) | int == rolled.resources[0].spec.replicas | int
        - rolled.resources[0].status.replicas | default(0) | int == rolled.resources[0].spec.replicas | int
      retries: 30
      delay: 5

    - name: Report the outcome
      ansible.builtin.debug:
        msg: "Rolled {{ target_service }} back (generation {{ before.resources[0].metadata.generation }} -> {{ rolled.resources[0].metadata.generation }})."
