---
# Remediation for: high_memory_usage
#
# Spreads load across more replicas so no single pod is OOM-killed. The brief calls this "increase replica count via
# kubectl scale" (section 6).
#
# Safe by construction: only approved services and namespaces, and only 1 to max_replicas replicas. It records the previous
# replica count so the dispatcher can roll the change back if recovery is not verified.
#
# replace_pods: true (used for high_memory_usage) goes one step further. More replicas alone leave the pod that holds the leak
# running, so after scaling out the playbook also rolls every pod (the same annotation patch as restart_service.yml). A rolling
# update brings new pods up before the old ones go, and nothing that leaked survives. Default false: a plain scale-out.
#
#   ansible-playbook -i ../inventory/localhost.yml scale_replicas.yml \
#     -e target_service=transaction-service -e replicas=3
- name: Scale a service horizontally
  hosts: localhost
  gather_facts: false

  vars:
    k8s_namespace: autosre
    target_service: transaction-service
    replicas: 3
    replace_pods: false
    max_replicas: 5
    allowed_services: [transaction-service]
    allowed_namespaces: [autosre]

  tasks:
    - name: Refuse anything outside the approved target and range
      ansible.builtin.assert:
        that:
          - target_service in allowed_services
          - k8s_namespace in allowed_namespaces
          - replicas | int >= 1
          - replicas | int <= max_replicas | int
          - replace_pods is boolean
        fail_msg: "{{ k8s_namespace }}/{{ target_service }} x{{ replicas }} is not an approved scale operation."

    - name: Read the deployment before scaling
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ target_service }}"
        namespace: "{{ k8s_namespace }}"
      register: before

    - name: Fail early if the deployment does not exist
      ansible.builtin.assert:
        that: before.resources | length == 1
        fail_msg: "{{ target_service }} not found in {{ k8s_namespace }}."

    - name: Scale {{ target_service }} to {{ replicas }} replica(s)
      kubernetes.core.k8s_scale:
        api_version: apps/v1
        kind: Deployment
        name: "{{ target_service }}"
        namespace: "{{ k8s_namespace }}"
        replicas: "{{ replicas | int }}"
        wait: true
        wait_timeout: 120

    - name: Read the deployment after scaling (a scale changes the generation too)
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ target_service }}"
        namespace: "{{ k8s_namespace }}"
      register: after_scale
      when: replace_pods | bool

    - name: Roll every pod so the one holding a leak is replaced
      kubernetes.core.k8s:
        api_version: apps/v1
        kind: Deployment
        name: "{{ target_service }}"
        namespace: "{{ k8s_namespace }}"
        state: patched
        definition:
          spec:
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/restartedAt: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime }}"
                  autosre.io/restarted-by: remediation-dispatcher
      when: replace_pods | bool

    - name: Wait for the new pods to be complete and available
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ target_service }}"
        namespace: "{{ k8s_namespace }}"
      register: rolled
      until:
        - rolled.resources | length == 1
        - rolled.resources[0].metadata.generation | int > after_scale.resources[0].metadata.generation | int
        - rolled.resources[0].status.observedGeneration | default(0) | int >= rolled.resources[0].metadata.generation | int
        - rolled.resources[0].status.updatedReplicas | default(0) | int == rolled.resources[0].spec.replicas | int
        - rolled.resources[0].status.availableReplicas | default(0) | int == rolled.resources[0].spec.replicas | int
        - rolled.resources[0].status.replicas | default(0) | int == rolled.resources[0].spec.replicas | int
      retries: 30
      delay: 5
      when: replace_pods | bool

    - name: Report the outcome
      ansible.builtin.debug:
        msg: >-
          Scaled {{ target_service }} in {{ k8s_namespace }} from {{ before.resources[0].spec.replicas }}
          to {{ replicas }} replica(s){{ ' and replaced every pod' if (replace_pods | bool) else '' }}.
