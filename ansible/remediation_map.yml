---
# Root cause label -> Ansible playbook (brief section 6).
#
# The dispatcher looks up the correlation engine's root_cause label here and
# runs the matching playbook. Anything absent from this table must escalate to
# a human rather than guessing a fix.
remediations:
  db_connection_pool_exhaustion:
    playbook: restart_service.yml
    description: Restart the affected service/pod
    extra_vars:
      target_service: transaction-service

  high_memory_usage:
    playbook: scale_replicas.yml
    description: Increase replica count, then replace the pods so the leaking one does not survive
    extra_vars:
      target_service: transaction-service
      replicas: 3
      replace_pods: true

  db_disk_full:
    playbook: clear_logs.yml
    description: Clear old log files
    extra_vars:
      target_service: database

  database_down:
    playbook: restore_service.yml
    description: Bring the database back to one ready replica
    extra_vars:
      target_service: database
      replicas: 1

  transaction_service_down:
    playbook: restore_service.yml
    description: Bring the transaction service back to one ready replica
    extra_vars:
      target_service: transaction-service
      replicas: 1

  api_gateway_down:
    playbook: restore_service.yml
    description: Bring the API gateway back to one ready replica
    extra_vars:
      target_service: api-gateway
      replicas: 1

  bad_rollout_transaction_service:
    playbook: rollback_deployment.yml
    description: Go back to the previous working revision of the transaction service
    extra_vars:
      target_service: transaction-service

  bad_rollout_api_gateway:
    playbook: rollback_deployment.yml
    description: Go back to the previous working revision of the API gateway
    extra_vars:
      target_service: api-gateway

  database_unreachable:
    playbook: fix_service_selector.yml
    description: Point the database Service's selector back at its pods
    extra_vars:
      target_service: database

  transaction_service_unreachable:
    playbook: fix_service_selector.yml
    description: Point the transaction service's Service selector back at its pods
    extra_vars:
      target_service: transaction-service

  api_gateway_unreachable:
    playbook: fix_service_selector.yml
    description: Point the API gateway's Service selector back at its pods
    extra_vars:
      target_service: api-gateway

  deployment_paused_transaction_service:
    playbook: resume_deployment.yml
    description: Resume the paused transaction service Deployment
    extra_vars:
      target_service: transaction-service

  deployment_paused_api_gateway:
    playbook: resume_deployment.yml
    description: Resume the paused API gateway Deployment
    extra_vars:
      target_service: api-gateway

  service_type_changed_database:
    playbook: restore_service_type.yml
    description: Put the database Service back to ClusterIP
    extra_vars:
      target_service: database

  service_type_changed_transaction_service:
    playbook: restore_service_type.yml
    description: Put the transaction service's Service back to ClusterIP
    extra_vars:
      target_service: transaction-service

  service_type_changed_api_gateway:
    playbook: restore_service_type.yml
    description: Put the API gateway's Service back to ClusterIP
    extra_vars:
      target_service: api-gateway

  replicas_above_baseline:
    playbook: restore_baseline_replicas.yml
    description: Scale the transaction service back to its baseline of one replica
    extra_vars:
      target_service: transaction-service
      replicas: 1

# Fallback for unmapped root causes.
default:
  action: notify_human
  description: No known remediation - page the on-call engineer.
