<head>

<title>AutoSRE Incident Console</title>
<style>

  }

    --ok:#4cc38a; --oksoft:#14301f; --bad:#ff8a7d; --badsoft:#35191a; --warn:#f0b64a; --warnsoft:#33280f; --info:#a9b6d0; --infosoft:#1f2840;
    --c-auto:#3fb883; --c-esc:#f06a58; --c-dry:#6f7fa0; --c-veto:#f0b64a; --c-skip:#55607a; --bannerbg:#3a2f0e; --bannerink:#f3d98a; --shadow:none; } }
  :root[data-theme="dark"] {
    --bg:#0e1320; --panel:#161d2e; --ink:#e6eaf3; --mute:#9aa6bd; --line:#26304a; --soft:#1c2438; --accent:#7ea2ff; --accentsoft:#1e2a4a;
    --ok:#4cc38a; --oksoft:#14301f; --bad:#ff8a7d; --badsoft:#35191a; --warn:#f0b64a; --warnsoft:#33280f; --info:#a9b6d0; --infosoft:#1f2840;
    --c-auto:#3fb883; --c-esc:#f06a58; --c-dry:#6f7fa0; --c-veto:#f0b64a; --c-skip:#55607a; --bannerbg:#3a2f0e; --bannerink:#f3d98a; --shadow:none; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button { font:inherit; cursor:pointer; }
  .app { display:grid; grid-template-columns:200px 1fr; grid-template-rows:auto 1fr; min-height:100%; }
  header { grid-column:1/3; display:flex; align-items:center; gap:14px; padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .brand { font-weight:700; font-size:15px; letter-spacing:.01em; } .brand span { color:var(--accent); }
  .grow { flex:1; }
  select,input[type=search],input[type=text] { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:6px 9px; }
  input[type=search] { min-width:220px; }
  .chip { border:1px solid var(--line); border-radius:99px; padding:3px 10px; background:var(--soft); color:var(--mute); font-size:12px; }
  .chip b { color:var(--ink); }
  nav { background:var(--panel); border-right:1px solid var(--line); padding:12px 8px; }
  nav button { display:flex; width:100%; align-items:center; justify-content:space-between; text-align:left; border:0; background:transparent; color:var(--ink); padding:8px 10px; border-radius:7px; font-weight:500; }
  nav button:hover { background:var(--soft); } nav button.on { background:var(--accentsoft); color:var(--accent); font-weight:650; }
  nav .count { font-size:11px; background:var(--badsoft); color:var(--bad); border-radius:99px; padding:0 7px; font-weight:700; }
  nav .sep { height:1px; background:var(--line); margin:10px 6px; }
  nav small { display:block; color:var(--mute); padding:6px 10px; font-size:11.5px; }
  main { padding:16px 18px 40px; min-width:0; }
  h1 { font-size:18px; margin:0 0 2px; } .sub { color:var(--mute); margin:0 0 14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .kpi { padding:10px 12px; } .kpi .l { color:var(--mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; }
  .kpi .v { font-size:22px; font-weight:700; margin-top:2px; } .kpi .d { color:var(--mute); font-size:11.5px; }
  .need { border-left:4px solid var(--bad); padding:10px 12px; margin-bottom:14px; }
  .need h2 { margin:0 0 6px; font-size:13px; color:var(--bad); text-transform:uppercase; letter-spacing:.05em; }
  .need .item { display:flex; gap:10px; align-items:center; padding:6px 0; border-top:1px solid var(--line); cursor:pointer; flex-wrap:wrap; }
  .need .item:first-of-type { border-top:0; } .need .item:hover { background:var(--soft); }
  .need .why { color:var(--mute); flex:1 1 300px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); font-weight:650; background:var(--soft); position:sticky; top:0; }
  tbody tr.row { cursor:pointer; } tbody tr.row:hover { background:var(--soft); }
  .tw { overflow:auto; max-height:none; border-radius:10px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:11.5px; font-weight:650; white-space:nowrap; }
  .p-auto { background:var(--oksoft); color:var(--ok); } .p-esc { background:var(--badsoft); color:var(--bad); } .p-dry { background:var(--infosoft); color:var(--info); }
  .p-veto { background:var(--warnsoft); color:var(--warn); } .p-skip { background:var(--soft); color:var(--mute); } .p-open { background:var(--bad); color:#fff; }
  .sev2 { color:var(--bad); font-weight:700; } .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; }
  .mute { color:var(--mute); }
  .pager { display:flex; gap:8px; align-items:center; justify-content:flex-end; padding:10px 4px; color:var(--mute); }
  .btn { border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:7px; padding:6px 11px; } .btn:hover { background:var(--soft); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; } .btn:disabled { opacity:.5; cursor:default; }
  /* drawer */
  .scrim { position:fixed; inset:0; background:rgba(10,16,30,.4); display:none; z-index:20; } .scrim.on { display:block; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(760px,100%); background:var(--bg); z-index:21; transform:translateX(100%); transition:transform .22s; overflow:auto; box-shadow:-8px 0 30px rgba(0,0,0,.25); }
  .drawer.on { transform:none; }
  .dh { position:sticky; top:0; background:var(--panel); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; gap:10px; align-items:center; z-index:2; flex-wrap:wrap; }
  .dh h2 { margin:0; font-size:16px; } .db { padding:14px 16px 40px; display:grid; gap:12px; }
  .sec { padding:12px 14px; } .sec h3 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); }
  .kv { display:grid; grid-template-columns:150px 1fr; gap:4px 12px; } .kv div:nth-child(odd) { color:var(--mute); }
  .tl { list-style:none; margin:0; padding:0; position:relative; } .tl li { display:grid; grid-template-columns:72px 14px 1fr; gap:8px; padding:4px 0; align-items:start; }
  .tl .dot { width:10px; height:10px; border-radius:50%; background:var(--c-dry); margin-top:5px; box-shadow:0 0 0 3px var(--panel); }
  .tl li:not(:last-child) .dot::after { content:""; display:block; width:2px; height:26px; background:var(--line); margin:10px 0 0 4px; }
  .k-ok .dot { background:var(--c-auto); } .k-bad .dot { background:var(--c-esc); } .k-human .dot { background:var(--accent); } .k-ml .dot { background:var(--c-veto); } .k-diag .dot { background:#8a6fe0; }
  .wbar { height:8px; border-radius:4px; background:var(--soft); overflow:hidden; min-width:90px; } .wbar i { display:block; height:100%; background:var(--c-auto); } .wbar.miss i { background:var(--c-skip); }

  .legend { display:flex; gap:12px; flex-wrap:wrap; margin-top:6px; color:var(--mute); font-size:12px; } .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; } .scard { padding:12px 14px; } .scard h3 { margin:0 0 6px; font-size:14px; }
  .chain { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:6px 0 12px; } .node { border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:6px 12px; font-weight:600; }

  @media (max-width: 820px) { .app { grid-template-columns:1fr; } nav { display:flex; overflow:auto; border-right:0; border-bottom:1px solid var(--line); padding:6px; } nav button { white-space:nowrap; width:auto; gap:8px; } nav .sep, nav small { display:none; } .grid2 { grid-template-columns:1fr; } header { padding:8px 12px; } main { padding:12px; } input[type=search] { min-width:0; flex:1; } th:nth-child(n+8), td:nth-child(n+8) { display:none; } }

<div class="app">
  <header>
    <div class="brand">Auto<span>SRE</span> Incident Console</div>

    <span class="chip">as of <b id="asof"></b></span>

    <button class="btn" id="theme" title="Switch light/dark">Theme</button>
  </header>
  <nav>

    <button data-view="trends">Trends</button>
    <button data-view="services">Services</button>

    <button data-view="settings">Settings &amp; changes</button>
    <div class="sep"></div>

  <main id="main"></main>
</div>

<aside class="drawer" id="drawer" aria-label="Incident detail"></aside>
<div class="toast" id="toast"></div>

</form></div>

<script>
const D = window.DATA;
const NOW = new Date(D.generated);
const INC = D.incidents.map(i => Object.assign({}, i, { ts: Date.parse(i.t), rs: Date.parse(i.received) })).sort((a, b) => b.ts - a.ts);
const $ = id => document.getElementById(id);
const esc = v => String(v === null || v === undefined ? '-' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CAUSE = { db_connection_pool_exhaustion: 'DB connection pool exhausted', high_memory_usage: 'High memory usage', db_disk_full: 'Database disk full' };
const cname = c => c ? (CAUSE[c] || c) : 'Unknown cause';
const ACTION = { auto_fixed: ['Auto-fixed', 'p-auto'], escalated: ['Escalated', 'p-esc'], dry_run: ['Dry run', 'p-dry'], vetoed: ['Held by ML gate', 'p-veto'], skipped: ['Skipped (cooldown)', 'p-skip'] };
let ME = '';
try { ME = localStorage.getItem('autosre-user') || ''; } catch (e) { /* no storage: the login just is not remembered */ }
const cleanName = v => String(v || '').replace(/[^A-Za-z0-9._ -]/g, '').trim().slice(0, 32);
function showLogin() {
  $('login').classList.add('on');
  $('who').innerHTML = !D.people.length ? '' : '<span class="mute" style="font-size:12px;width:100%">On the rota:</span>' + D.people.map(p => '<button type="button" data-u="' + p + '">' + p + '</button>').join('');
  $('who').querySelectorAll('button').forEach(b => b.onclick = () => { $('user').value = b.dataset.u; $('user').focus(); });
  $('user').focus();
}
function signIn(name) {
  ME = cleanName(name); if (!ME) return;
  try { localStorage.setItem('autosre-user', ME); } catch (e) { /* ignore */ }
  $('login').classList.remove('on'); $('me').textContent = ME; render();
}
function signOut() { ME = ''; try { localStorage.removeItem('autosre-user'); } catch (e) { /* ignore */ } closeDrawer(); $('user').value = ''; showLogin(); }
const who = a => a ? (a === ME ? a + ' (you)' : a) : null;
const state = { view: 'incidents', range: 30, q: '', action: '', cause: '', service: '', ml: '', page: 0, theme: null };

function fmt(ms) { return new Date(ms).toLocaleString('en-GB', { timeZone: 'UTC', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' UTC'; }
function ago(ms) { const s = (NOW - ms) / 1000; if (s < 90) return 'just now'; const m = s / 60; if (m < 90) return Math.round(m) + ' min ago'; const h = m / 60; if (h < 36) return Math.round(h) + ' h ago'; return Math.round(h / 24) + ' d ago'; }
function dur(s) { if (s === null || s === undefined) return '-'; if (s < 90) return Math.round(s) + ' s'; const m = s / 60; if (m < 90) return Math.round(m) + ' min'; return (m / 60).toFixed(1) + ' h'; }
const isOpen = i => !!i.open;
const inRange = i => NOW - i.ts <= state.range * 864e5;
function matches(i) {
  if (!inRange(i)) return false;
  if (state.action && (state.action === 'open' ? !isOpen(i) : i.action !== state.action)) return false;
  if (state.cause && (i.cause || 'unknown') !== state.cause) return false;
  if (state.service && i.service !== state.service) return false;
  if (state.ml && (i.ml || 'none') !== state.ml) return false;
  if (state.q) { const hay = [i.id, i.service, i.cause, cname(i.cause), i.assignee, i.action, i.playbook, i.note].join(' ').toLowerCase(); if (!hay.includes(state.q.toLowerCase())) return false; }
  return true;
}
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const pct = (n, d) => d ? Math.round(100 * n / d) + '%' : '-';

// ------------------------------------------------------------------------------------------ incidents view
function viewIncidents() {
  const inr = INC.filter(inRange), list = INC.filter(matches);
  const fixed = inr.filter(i => i.action === 'auto_fixed'), esc_ = inr.filter(i => ['escalated', 'vetoed'].includes(i.action));
  const live = inr.filter(i => i.action !== 'dry_run');
  const open = INC.filter(isOpen);
  const reviewBad = inr.filter(i => i.review).length;
  const kpi = (l, v, d) => `<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
  const needs = open.map(i => `<div class="item" data-id="${i.id}"><span class="pill p-open">OPEN</span><b class="mono">${i.id}</b><span class="${i.sev === 'SEV2' ? 'sev2' : ''}">${i.sev}</span><span>${esc(i.service)}</span><span class="why">${esc(cname(i.cause))}: ${esc(i.reason)}</span><span class="mute">${ago(i.rs)}${i.assignee ? ' &middot; ' + esc(who(i.assignee)) + ' investigating' : ' &middot; <b style="color:var(--bad)">unacknowledged</b>'}</span></div>`).join('');
  const per = 25, pages = Math.max(1, Math.ceil(list.length / per)); state.page = Math.min(state.page, pages - 1);
  const rows = list.slice(state.page * per, state.page * per + per).map(i => {
    const a = isOpen(i) ? ['Open', 'p-open'] : ACTION[i.action];
    return `<tr class="row" data-id="${i.id}"><td title="${fmt(i.ts)}">${ago(i.ts)}<div class="mute" style="font-size:11px">${fmt(i.ts).slice(0, 17)}</div></td><td class="mono">${i.id}</td><td class="${i.sev === 'SEV2' ? 'sev2' : ''}">${i.sev}</td><td>${esc(i.service)}</td><td>${esc(cname(i.cause))}${i.ambiguous.length ? ' <span class="pill p-veto" title="deciding alerts of two causes fired together">2 causes</span>' : ''}</td><td>${i.confidence === null ? '-' : Math.round(i.confidence * 100) + '%'}</td><td>${esc(i.ml || (i.cause ? 'n/a' : '-'))}</td><td><span class="pill ${a[1]}">${a[0]}</span>${i.review ? ' <span class="pill p-esc" title="' + esc(i.review) + '">review</span>' : ''}</td><td>${dur(i.ttr_s)}</td><td>${esc(who(i.assignee) || (i.action === 'auto_fixed' ? 'automation' : '-'))}</td></tr>`;
  }).join('');
  const opt = (arr, cur, all) => `<option value="">${all}</option>` + arr.map(([v, l]) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${l}</option>`).join('');
  return `<h1>Incidents</h1><p class="sub">${list.length} of ${inr.length} incidents in range match. Click a row for the full timeline, evidence and what each setting would have decided.</p>
  ${open.length ? `<div class="card need"><h2>Needs you now (${open.length})</h2>${needs}</div>` : ''}
  <div class="kpis">
    ${kpi('Incidents', inr.length, 'in the selected range')}
    ${kpi('Auto-resolved', pct(fixed.length, live.length), fixed.length + ' of ' + live.length + ' with live remediation')}
    ${kpi('Escalated to a person', pct(esc_.length, live.length), esc_.length + ' needed a human')}
    ${kpi('Time to fix (auto)', dur(mean(fixed.map(i => i.ttr_s).filter(x => x))), 'alert to verified recovery')}
    ${kpi('Time to fix (human)', dur(mean(esc_.map(i => i.ttr_s).filter(x => x))), 'escalation to resolved')}
    ${kpi('Flagged in review', reviewBad, 'automation named the wrong cause')}
  </div>
  <div class="bar">
    <select id="f-action">${opt([['open', 'Open now'], ['auto_fixed', 'Auto-fixed'], ['escalated', 'Escalated'], ['vetoed', 'Held by ML gate'], ['dry_run', 'Dry run'], ['skipped', 'Skipped (cooldown)']], state.action, 'All outcomes')}</select>
    <select id="f-cause">${opt([['db_connection_pool_exhaustion', 'DB pool exhausted'], ['high_memory_usage', 'High memory'], ['db_disk_full', 'Disk full'], ['unknown', 'Unknown cause']], state.cause, 'All causes')}</select>
    <select id="f-service">${opt(['api-gateway', 'transaction-service', 'database', 'frontend'].map(s => [s, s]), state.service, 'All services')}</select>

function csv() {
  const rows = [['id', 'time', 'severity', 'service', 'cause', 'confidence', 'ml', 'outcome', 'ttr_s']].concat(INC.filter(matches).map(i => [i.id, i.t, i.sev, i.service, i.cause || 'unknown', i.confidence, i.ml, i.action, i.ttr_s]));
  const blob = new Blob([rows.map(r => r.join(',')).join('\n')], { type: 'text/csv' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'autosre-incidents.csv'; a.click();
}
function render() {
  const v = { incidents: viewIncidents, trends: viewTrends, services: viewServices, playbooks: viewPlaybooks, settings: viewSettings, runs: viewRuns }[state.view];
  $('main').innerHTML = v();
  document.querySelectorAll('nav button[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === state.view));
  $('n-open').textContent = INC.filter(isOpen).length || ''; $('n-open').style.display = INC.filter(isOpen).length ? '' : 'none';
  $('main').querySelectorAll('[data-id]').forEach(r => r.onclick = () => openDrawer(r.dataset.id));
  $('main').querySelectorAll('[data-svc]').forEach(b => b.onclick = () => { state.view = 'incidents'; state.service = b.dataset.svc; state.range = 365; $('range').value = '365'; state.page = 0; render(); });
  if (state.view === 'incidents') {
    [['f-action', 'action'], ['f-cause', 'cause'], ['f-service', 'service'], ['f-ml', 'ml']].forEach(([id, k]) => $(id).onchange = e => { state[k] = e.target.value; state.page = 0; render(); });
    $('f-clear').onclick = () => { Object.assign(state, { action: '', cause: '', service: '', ml: '', q: '', page: 0 }); $('q').value = ''; render(); };
    $('prev').onclick = () => { state.page--; render(); }; $('next').onclick = () => { state.page++; render(); }; $('export').onclick = csv;
  }
}
document.querySelectorAll('nav button[data-view]').forEach(b => b.onclick = () => { state.view = b.dataset.view; render(); window.scrollTo(0, 0); });
$('range').onchange = e => { state.range = +e.target.value; state.page = 0; render(); };
$('q').oninput = e => { state.q = e.target.value; state.page = 0; if (state.view !== 'incidents') state.view = 'incidents'; render(); $('q').focus(); };
$('scrim').onclick = closeDrawer; document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
$('theme').onclick = () => { const dark = document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark'); };
$('asof').textContent = fmt(NOW.getTime());
if (D.mode === 'real') { $('env').textContent = 'lab cluster (autosre namespace)'; state.range = 9999; $('range').value = '9999'; }
if (D.runs && D.runs.length) $('nav-runs').style.display = '';
$('signout').onclick = signOut;
$('loginform').onsubmit = e => { e.preventDefault(); signIn($('user').value); };
if (ME) { $('me').textContent = ME; } else { showLogin(); }
render();
</script>
</body>
</html>
